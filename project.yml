name: QobuzShell
options:
  bundleIdPrefix: com.example          # TODO: change to your own reverse-DNS prefix
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  # Marks the project as checked by this Xcode, so it stops offering
  # "Update to recommended settings". Those settings are below instead:
  # clicking Perform Changes edits the generated project, which xcodegen
  # overwrites.
  xcodeVersion: "27.0"

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Xcode's recommended settings
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES

targets:
  QobuzShell:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
        excludes:
          - "Info.plist"
          - "QobuzShell.entitlements"
          - "Fonts/**"
      # Folder reference, so the bundle gets a real Fonts/ directory
      - path: Resources/Fonts
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.QobuzShell
        PRODUCT_NAME: QobuzShell
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/QobuzShell.entitlements
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
