name: Rosin
options:
  bundleIdPrefix: design.hicks
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  # Marks the project as checked by this Xcode, so it stops offering
  # "Update to recommended settings". Those settings are below instead:
  # clicking Perform Changes edits the generated project, which xcodegen
  # overwrites.
  xcodeVersion: "27.0"

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.10.0"

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Xcode's recommended settings
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES

targets:
  Rosin:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
        excludes:
          - "Info.plist"
          - "Rosin.entitlements"
          - "Fonts/**"
      # Folder reference, so the bundle gets a real Fonts/ directory
      - path: Resources/Fonts
        type: folder
        buildPhase: resources
    dependencies:
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: design.hicks.Rosin
        PRODUCT_NAME: Rosin
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/Rosin.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: RQH65SH9L5
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        # Sparkle updates (Info.plist's SUFeedURL and SUPublicEDKey). While
        # either is empty, Updater doesn't start and Check for Updates is
        # disabled. The key is the public half printed by Sparkle's
        # generate_keys; the private half stays in the login keychain.
        SPARKLE_FEED_URL: "https://rosin.hicks.design/appcast.xml"
        SPARKLE_PUBLIC_KEY: "A02cmz8s6py28gMY33dgVkg+F5LbccZJlZQxgKYekvI="
