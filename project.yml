name: Rosin
options:
  bundleIdPrefix: design.hicks
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  # Marks the project as checked by this Xcode, so it stops offering
  # "Update to recommended settings". Those settings are below instead:
  # clicking Perform Changes edits the generated project, which xcodegen
  # overwrites.
  xcodeVersion: "27.0"

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.10.0"

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.3"
    CURRENT_PROJECT_VERSION: "4"
    # Xcode's recommended settings
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES

targets:
  Rosin:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
        excludes:
          - "Info.plist"
          - "Rosin.entitlements"
          - "Fonts/**"
          # Compiled by the script below, for Patcher to install in Qobuz
          - "Qobuz.icon"
          - "Qobuz.icon/**"
      # Folder reference, so the bundle gets a real Fonts/ directory
      - path: Resources/Fonts
        type: folder
        buildPhase: resources
    postCompileScripts:
      # Qobuz.icon is the icon Patcher gives Qobuz. actool compiles it into
      # Rosin's Resources/QobuzIcon/: a flat Qobuz.icns, which Patcher sets as
      # Qobuz's Finder custom icon, and an Assets.car, which isn't used (it
      # would need an Info.plist edit, and that breaks Qobuz's signature).
      # ENABLE_USER_SCRIPT_SANDBOXING only lets the script read what's under
      # inputFiles and write what's under outputFiles, plus anything in
      # TEMP_DIR. Listing the .icon folder doesn't cover the files in it, so
      # each one is listed: add any new image Icon Composer puts in Assets/.
      # Even then, actool's helpers (ictool, AssetCatalogAgent) are refused
      # reading the listed files in place and writing the catalog straight
      # into the bundle (it writes a temporary file beside Assets.car first),
      # so the .icon is copied into TEMP_DIR, compiled there, and the results
      # copied out.
      - name: Compile Qobuz Icon
        script: |
          set -e
          out="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/QobuzIcon"
          work="$TEMP_DIR/QobuzIcon"
          rm -rf "$work"
          mkdir -p "$out" "$work/compiled"
          cp -R "$SRCROOT/Resources/Qobuz.icon" "$work/Qobuz.icon"
          xcrun actool "$work/Qobuz.icon" --compile "$work/compiled" \
            --platform macosx --minimum-deployment-target 10.15 --app-icon Qobuz \
            --output-partial-info-plist "$DERIVED_FILE_DIR/QobuzIcon-Info.plist" \
            --output-format human-readable-text --notices --warnings --errors
          cp "$work/compiled/Assets.car" "$work/compiled/Qobuz.icns" "$out/"
        inputFiles:
          - $(SRCROOT)/Resources/Qobuz.icon
          - $(SRCROOT)/Resources/Qobuz.icon/icon.json
          - $(SRCROOT)/Resources/Qobuz.icon/Assets
          - $(SRCROOT)/Resources/Qobuz.icon/Assets/SVG Image.svg
          - $(SRCROOT)/Resources/Qobuz.icon/Assets/SVG Image 2.svg
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/QobuzIcon/Assets.car
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/QobuzIcon/Qobuz.icns
          - $(DERIVED_FILE_DIR)/QobuzIcon-Info.plist
    dependencies:
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: design.hicks.Rosin
        PRODUCT_NAME: Rosin
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/Rosin.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: RQH65SH9L5
        ASSETCATALOG_COMPILER_APPICON_NAME: Rosin
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        # Sparkle updates (Info.plist's SUFeedURL and SUPublicEDKey). While
        # either is empty, Updater doesn't start and Check for Updates is
        # disabled. The key is the public half printed by Sparkle's
        # generate_keys; the private half stays in the login keychain.
        SPARKLE_FEED_URL: "https://rosin.hicks.design/appcast.xml"
        SPARKLE_PUBLIC_KEY: "A02cmz8s6py28gMY33dgVkg+F5LbccZJlZQxgKYekvI="
